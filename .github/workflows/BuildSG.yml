name: Build Smokin' Guns for RK3326 (SDL2, native ARM64)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-smokinguns.yml'
      - '.github/scripts/patch_arm64.py'

permissions:
  contents: read

env:
  ZIP_NAME: SmokinGuns-PortMaster-RK3326-SDL2.zip
  PORT_DIR: smokinguns

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip utility
        run: sudo apt-get update -y && sudo apt-get install -y zip

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Write in-container build script
        run: |
          mkdir -p work/src work/out/game work/out/libs.aarch64
          cp .github/scripts/patch_arm64.py work/patch_arm64.py

          cat > work/build.sh << 'BUILD_SCRIPT_EOF'
          #!/bin/bash
          set -euo pipefail
          set -x
          export DEBIAN_FRONTEND=noninteractive

          export OPTIMIZE="-O3 -mcpu=cortex-a35 -mtune=cortex-a35 -pipe -fomit-frame-pointer -ffast-math -ftree-vectorize -fno-semantic-interposition -fno-plt -fno-exceptions -fno-rtti -fno-stack-protector -fno-asynchronous-unwind-tables -fmerge-all-constants -falign-functions=4 -DNDEBUG -w"
          export LDFLAGS="-Wl,-O1 -Wl,--as-needed"

          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git pkg-config ca-certificates wget file zip python3 ccache \
            libsdl2-dev \
            libfreetype6-dev libjpeg-dev libpng-dev zlib1g-dev \
            libogg-dev libvorbis-dev libopus-dev libopusfile-dev \
            libcurl4-openssl-dev libopenal-dev libspeex-dev \
            libgbm-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libx11-dev libxext-dev libgl1-mesa-dev libglu1-mesa-dev \
            autoconf automake libtool
          git config --global --add safe.directory '*'

          ccache -M 2G
          export CC="ccache gcc"
          export CXX="ccache g++"

          CMAKE_VERSION=3.28.3
          wget -q "https://cmake.org/files/v3.28/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" -O /tmp/cmake.tar.gz
          mkdir -p /opt/cmake
          tar -xzf /tmp/cmake.tar.gz -C /opt/cmake --strip-components=1
          export PATH="/opt/cmake/bin:$PATH"

          # ----------------------------------------------------------------
          # GL4ES
          # ----------------------------------------------------------------
          cd /work/src
          if [ ! -d gl4es ]; then git clone --depth=1 https://github.com/ptitSeb/gl4es.git; fi
          cd gl4es
          mkdir -p build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$OPTIMIZE" \
            -DNOX11=ON -DGBM=ON -DEGL_WRAPPER=ON \
            -DDEFAULT_ES=2 -DSTATICLIB=OFF
          make -j"$(nproc)"

          GL4ES_LIB="$(find /work/src/gl4es -name 'libGL.so.1' -print -quit)"
          EGL_LIB="$(find /work/src/gl4es -name 'libEGL.so.1' -print -quit)"
          [ -n "$GL4ES_LIB" ] && [ -n "$EGL_LIB" ] || { echo "[ERROR] GL4ES libs missing"; exit 1; }
          cp "$GL4ES_LIB" /work/out/libs.aarch64/libGL.so.1
          cp "$EGL_LIB"  /work/out/libs.aarch64/libEGL.so.1

          # ----------------------------------------------------------------
          # Smokin' Guns: ioquake3 (SDL2) + Smokin' Guns game code
          # ----------------------------------------------------------------
          cd /work/src
          if [ ! -d SmokinGuns ]; then
            # Clone the SDL2-capable ioquake3 base
            git clone --depth=1 https://github.com/sardylan/ioq3.git SmokinGuns
          fi
          cd SmokinGuns

          # Overlay Smokin' Guns game code (from official repo)
          # We clone the game code into a separate dir and copy the game-specific
          # files over the ioquake3 base.
          if [ ! -d /work/src/SmokinGunsGame ]; then
            git clone --depth=1 https://github.com/smokin-guns/SmokinGuns.git /work/src/SmokinGunsGame
          fi

          # Copy Smokin' Guns game-specific code
          for d in code/game code/cgame code/ui; do
            mkdir -p "$d"
            if [ -d "/work/src/SmokinGunsGame/$d" ]; then
              cp -r /work/src/SmokinGunsGame/$d/* "$d/" 2>/dev/null || true
            fi
          done

          # Copy Smokin' Guns Makefile.smokinguns if present
          if [ -f /work/src/SmokinGunsGame/Makefile.smokinguns ]; then
            cp /work/src/SmokinGunsGame/Makefile.smokinguns .
          fi

          # Apply SDL2 / ARM64 patches
          echo "==> Applying SDL2 / ARM64 patch script..."
          python3 /work/patch_arm64.py

          rm -rf build/release-linux-aarch64/ || true

          # Build with SDL2 flags explicitly set
          echo "==> Building Smokin' Guns (SDL2, native SO, REND1 only)"
          make release -j"$(nproc)" \
            PLATFORM=linux ARCH=aarch64 COMPILE_ARCH=aarch64 \
            CC="$CC" \
            BUILD_STANDALONE=1 BUILD_GAME_QVM=0 BUILD_GAME_SO=1 BUILD_SERVER=0 \
            BUILD_RENDERER_REND2=0 \
            USE_OPENAL=0 USE_CODEC_VORBIS=0 USE_CURL=0 USE_MUMBLE=0 USE_VOIP=0 \
            USE_INTERNAL_ZLIB=1 USE_INTERNAL_SPEEX=1 USE_LOCAL_HEADERS=0 \
            WERROR=0 \
            SDL_CFLAGS="-I/usr/include/SDL2 -D_REENTRANT" \
            SDL_LIBS="-lSDL2" \
            CFLAGS="-w -fcommon" \
            OPTIMIZE="$OPTIMIZE" LDFLAGS="$LDFLAGS"

          BUILD_OUT="$(find /work/src/SmokinGuns/build -maxdepth 1 -type d -name 'release-linux-aarch64' -print -quit)"
          [ -n "$BUILD_OUT" ] || { echo "[ERROR] build dir missing"; exit 1; }

          ENGINE_BIN="$(find "$BUILD_OUT" -maxdepth 1 -type f -executable ! -name '*.so' ! -name '*.sh' ! -name '*.a' -print -quit)"
          [ -n "$ENGINE_BIN" ] || { echo "[ERROR] engine binary missing"; exit 1; }
          cp "$ENGINE_BIN" /work/out/game/smokinguns.aarch64
          chmod +x /work/out/game/smokinguns.aarch64

          find "$BUILD_OUT" -maxdepth 1 -name 'renderer_*.so' -exec cp {} /work/out/game/ \;

          if [ -d "$BUILD_OUT/baseq3" ]; then
            mkdir -p /work/out/game/modules
            find "$BUILD_OUT/baseq3" -maxdepth 1 -name '*.so' -exec cp {} /work/out/game/modules/ \;
          fi

          # Also check for smokinguns subdirectory
          if [ -d "$BUILD_OUT/smokinguns" ]; then
            mkdir -p /work/out/game/modules
            find "$BUILD_OUT/smokinguns" -maxdepth 1 -name '*.so' -exec cp {} /work/out/game/modules/ \;
          fi

          echo "==> Layout of /work/out/game:"
          ls -la /work/out/game/
          ls -la /work/out/game/modules/ 2>/dev/null || echo "(no modules dir)"
          file /work/out/game/smokinguns.aarch64
          file /work/out/libs.aarch64/libGL.so.1
          file /work/out/libs.aarch64/libEGL.so.1
          echo "Build finished successfully."
          BUILD_SCRIPT_EOF
          chmod +x work/build.sh

      - name: Build inside Ubuntu 20.04 aarch64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}/work":/work \
            -w /work ubuntu:20.04 bash /work/build.sh

      - name: Assemble PortMaster Package
        run: |
          set -euo pipefail
          PKG="$GITHUB_WORKSPACE/package"
          rm -rf "$PKG"
          mkdir -p "$PKG/${PORT_DIR}/libs.aarch64"
          mkdir -p "$PKG/${PORT_DIR}/${PORT_DIR}"

          cp work/out/game/smokinguns.aarch64 "$PKG/${PORT_DIR}/smokinguns.aarch64"
          chmod +x "$PKG/${PORT_DIR}/smokinguns.aarch64"

          find work/out/game -maxdepth 1 -name 'renderer_*.so' -exec cp {} "$PKG/${PORT_DIR}/" \;

          if [ -d work/out/game/modules ]; then
            find work/out/game/modules -maxdepth 1 -name '*.so' -exec cp {} "$PKG/${PORT_DIR}/${PORT_DIR}/" \;
          fi

          cp work/out/libs.aarch64/libGL.so.1  "$PKG/${PORT_DIR}/libs.aarch64/libGL.so.1"
          cp work/out/libs.aarch64/libEGL.so.1 "$PKG/${PORT_DIR}/libs.aarch64/libEGL.so.1"

          cat > "$PKG/${PORT_DIR}/smokinguns.gptk" << 'GPTK_EOF'
          [ANALOG1]
          UP = W
          DOWN = S
          LEFT = A
          RIGHT = D

          [ANALOG2]
          UP = mouse_move_up
          DOWN = mouse_move_down
          LEFT = mouse_move_left
          RIGHT = mouse_move_right

          [BUTTONS]
          A = mouse_left
          B = mouse_right
          X = SPACE
          Y = R
          L1 = TAB
          R1 = mouse_middle
          L2 = Q
          R2 = E
          START = ESCAPE
          SELECT = F1
          L3 = LEFTSHIFT
          R3 = C
          UP = UP
          DOWN = DOWN
          LEFT = LEFT
          RIGHT = RIGHT
          GPTK_EOF

          cat > "$PKG/${PORT_DIR}/${PORT_DIR}/PUT_YOUR_PK3_FILES_HERE.txt" << 'PLACEHOLDER_EOF'
          Copy your own legally obtained Smokin' Guns .pk3 data files
          (e.g. sg_pak0.pk3) into this folder before launching the port.
          PLACEHOLDER_EOF

          cat > "$PKG/${PORT_DIR}/port.json" << 'PORTJSON_EOF'
          {
            "version": 2,
            "name": "Smokin Guns.sh",
            "items": ["Smokin Guns.sh"],
            "items_opt": null,
            "attr": {
              "title": "Smokin' Guns",
              "desc": "Native ARM64 SDL2 build with GL4ES. Cortex-A35 optimized.",
              "genres": ["fps", "shooter"],
              "porter": ["community"],
              "image": {},
              "rtr": false,
              "runtime": null,
              "reqs": [],
              "arch": ["aarch64"]
            }
          }
          PORTJSON_EOF

          cat > "$PKG/Smokin Guns.sh" << 'LAUNCH_EOF'
          #!/bin/bash
          # PortMaster launch script for Smokin' Guns (RK3326 / ArkOS4Clone)
          # SDL2 + GL4ES, native .so modules, no QVM.

          GAMEDIR="/roms/ports/smokinguns"
          LOG_FILE="${GAMEDIR}/debug.log"
          exec > >(tee -a "$LOG_FILE") 2>&1
          echo "=== Smokin' Guns launch (SDL2) ==="
          echo "Date: $(date)"

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}
          if [ -d "/opt/system/Tools/PortMaster/" ]; then
              controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
              controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
              controlfolder="$XDG_DATA_HOME/PortMaster"
          else
              controlfolder="/roms/ports/PortMaster"
          fi

          if [ -f "${controlfolder}/control.txt" ]; then
              source "${controlfolder}/control.txt"
              [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"
              get_controls
          fi

          cd "$GAMEDIR" || exit 1
          export HOME="${GAMEDIR}"
          mkdir -p "${GAMEDIR}/.smokinguns"

          export SDL_VIDEODRIVER=kmsdrm
          export SDL_AUDIODRIVER=alsa
          export SDL_JOYSTICK_DEVICE=/dev/input/js0

          export LIBGL_ES=2
          export LIBGL_GL=1
          export LIBGL_NOTEST=1
          export LIBGL_FB=1
          export LIBGL_FBO=0
          export LIBGL_NOERROR=1
          export LIBGL_FORCE16BITS=1
          export LIBGL_BATCH=100
          export LIBGL_BEGINEND=2
          export LIBGL_FASTMATH=1
          export LIBGL_NOBANNER=1
          export LIBGL_VSYNC=0
          export LIBGL_SILENTSTUB=1
          export LIBGL_XREFRESH=0
          export LIBGL_RECYCLEFBO=1
          export LIBGL_MIPMAP=5
          export LIBGL_SHRINK=8

          export LD_LIBRARY_PATH="${GAMEDIR}/libs.aarch64:${LD_LIBRARY_PATH}"

          echo "--- environment ---"
          echo "SDL_VIDEODRIVER=$SDL_VIDEODRIVER"
          echo "SDL_AUDIODRIVER=$SDL_AUDIODRIVER"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
          echo "--- drm devices ---"
          ls -la /dev/dri/ 2>&1 || true
          echo "--- input devices ---"
          ls -la /dev/input/js* /dev/input/event* 2>&1 || true

          $GPTOKEYB "smokinguns.aarch64" -c "${GAMEDIR}/smokinguns.gptk" &
          GPTOKEYB_PID=$!

          LD_PRELOAD="${GAMEDIR}/libs.aarch64/libGL.so.1:${GAMEDIR}/libs.aarch64/libEGL.so.1" \
            "${GAMEDIR}/smokinguns.aarch64" \
            +set com_hunkMegs 256 \
            +set com_maxfps 40 \
            +set net_enabled 0 \
            +set sv_pure 0 \
            +set vm_cgame 0 \
            +set vm_game 0 \
            +set vm_ui 0 \
            +set s_useOpenAL 0 \
            +set r_customwidth 640 \
            +set r_customheight 480 \
            +set r_fullscreen 1 \
            +set fs_basepath "${GAMEDIR}" \
            +set fs_homepath "${GAMEDIR}" \
            +set fs_game smokinguns

          GAME_EXIT=$?
          echo "Game exited with code: ${GAME_EXIT}"

          unset LD_PRELOAD
          unset LD_LIBRARY_PATH
          [ -n "$GPTOKEYB_PID" ] && kill "$GPTOKEYB_PID" 2>/dev/null || true
          exit $GAME_EXIT
          LAUNCH_EOF
          chmod +x "$PKG/Smokin Guns.sh"

      - name: Create zip artifact
        run: |
          cd package
          zip -r "$GITHUB_WORKSPACE/${ZIP_NAME}" "Smokin Guns.sh" "${PORT_DIR}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmokinGuns-PortMaster-RK3326-SDL2
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
